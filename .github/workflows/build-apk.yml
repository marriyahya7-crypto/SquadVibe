
name: Build SquadVibe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup Firebase configuration
        run: |
          cp android/app/google-services.json /tmp/google-services.json

      - name: Generate Android project
        run: flutter create --platforms=android --project-name squadvibe .

      - name: Restore Firebase configuration
        run: |
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Android permissions for calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
          ]
          additions = []
          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  additions.append(f'    <uses-permission android:name="{permission}" />')
          if additions:
              text = text.replace("<application", "\n".join(additions) + "\n    <application", 1)
              manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          if gradle.name.endswith(".kts"):
              source = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", source)
              source = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", source)
          else:
              source = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", source)
              source = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 23", source)
          # flutter_local_notifications requires Java core library desugaring.
          if gradle.name.endswith(".kts"):
              if "isCoreLibraryDesugaringEnabled = true" not in source:
                  source = source.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )
              if "coreLibraryDesugaring(" not in source:
                  source, count = re.subn(
                      r"dependencies\s*\{",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      source,
                      count=1
                  )
                  if count != 1:
                      source += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if "coreLibraryDesugaringEnabled true" not in source:
                  source = source.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1
                  )
              if "coreLibraryDesugaring" not in source:
                  source, count = re.subn(
                      r"dependencies\s*\{",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      source,
                      count=1
                  )
                  if count != 1:
                      source += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          gradle.write_text(source)
          print("Call permissions, Android minSdk and core library desugaring configured")
          PY

  
      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("Gradle files not found")

          s = settings.read_text()
          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(s)

          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              a = a.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )
              app.write_text(a)

          print("Firebase plugin configured")
          PY
      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SquadVibe-APK
          path: build/app/outputs/flutter-apk/app-release.apk
