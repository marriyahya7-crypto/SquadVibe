
name: Build SquadVibe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup Firebase configuration
        run: |
          cp android/app/google-services.json /tmp/google-services.json

      - name: Generate Android project
        run: flutter create --platforms=android --project-name squadvibe .

      - name: Restore Firebase configuration
        run: |
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          text = settings.read_text()
          marker = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          if marker not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    ' + marker,
                  1
              )
          settings.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()
          marker = 'id("com.google.gms.google-services")'
          if marker not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + marker,
                  1
              )
          app.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SquadVibe-APK
          path: build/app/outputs/flutter-apk/app-release.apk
